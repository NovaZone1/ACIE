[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "acie-hri"
version = "0.1.0"
description = "Approach-conditioned interaction evidence research implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "torch>=2.2,<3", "scikit-learn>=1.3,<2", "PyYAML>=6,<7", "joblib>=1.3"]
[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]
data = ["pandas>=2", "huggingface-hub>=0.27", "torchvision>=0.17", "print-color>=0.4,<1", "millify>=0.1,<1"]
plot = ["matplotlib>=3.7"]
[project.scripts]
acie = "acie.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
